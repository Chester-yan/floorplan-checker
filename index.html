<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>住宅房型檢核系統</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
  
<body>

<div class="container">
  <header>
    <!-- 置中標題與滿版底線 -->
    <h1 style="text-align: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 2px solid var(--primary);">
      住宅房型檢核系統
    </h1>
      
    <!-- 第一行：建案戶號與房型規格、套房數量設定 -->
    <div class="type-selector" style="align-items: center; justify-content: space-between;">
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <label style="display:inline-flex; align-items:center; gap:6px;">
          <span>建案名稱：</span>
          <input type="text" id="iptProjectName" placeholder="例如：遠雄中央公園" style="padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.9rem; width: 130px;" oninput="updateSpecTitle()">
        </label>

        <label style="display:inline-flex; align-items:center; gap:6px;">
          <span>戶號：</span>
          <input type="text" id="iptUnitNumber" placeholder="例如：A1-8F" style="padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.9rem; width: 90px;" oninput="updateSpecTitle()">
        </label>

        <span style="color: #cbd5e1;">|</span>

        <label>房型：</label>
        <div class="btn-group">
          <button type="button" class="type-btn" onclick="setPreset('1')">1房</button>
          <button type="button" class="type-btn active" onclick="setPreset('2')">2房</button>
          <button type="button" class="type-btn" onclick="setPreset('3')">3房</button>
          <button type="button" class="type-btn" onclick="setPreset('4')">4房</button>
        </div>
        <input type="hidden" id="selBedrooms" value="2">

        <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-weight:600; font-size:0.9rem; color:#1e293b;">
          <input type="checkbox" id="chkPlusOne" onchange="togglePlusOne(this.checked)" style="width:16px; height:16px; cursor:pointer;">
          <span>＋1房</span>
        </label>

        <!-- 套房數量選擇器 (唯一控制來源) -->
        <label style="font-weight: 600; font-size: 0.9rem; color: #1e293b; display: inline-flex; align-items: center; gap: 6px; margin-left: 4px;">
          <span>套房數量：</span>
          <select id="selSuiteCount" onchange="onSuiteCountChange(parseInt(this.value))" style="padding: 4px 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 600; color: var(--primary);">
            <!-- 選項由 JS 動態生成 -->
          </select>
        </label>

        <span id="dispRoomSpec" style="font-weight: 700; color: var(--primary); font-size: 0.95rem; background: #eff6ff; padding: 4px 10px; border-radius: 6px; border: 1px solid #bfdbfe;">
          2房/0套房
        </span>
      </div>
    </div>

    <!-- 第二行：特殊加分空間勾選開關 -->
    <div class="type-selector" style="margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e2e8f0; align-items: center; gap: 16px;">
      <label style="color: #4338ca; font-weight: 700;">特殊加分空間：</label>
      <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:0.9rem; font-weight:600;">
        <input type="checkbox" id="chkBonusZhongDao" onchange="toggleBonusSpace('zhong_dao', this.checked)" style="width:16px; height:16px; cursor:pointer;">
        <span>獨立中島 (+6分)</span>
      </label>
      <label id="lblBonusXuanGuan" style="display:none; align-items:center; gap:6px; cursor:pointer; font-size:0.9rem; font-weight:600;">
        <input type="checkbox" id="chkBonusXuanGuan" onchange="toggleBonusSpace('xuan_guan', this.checked)" style="width:16px; height:16px; cursor:pointer;">
        <span>獨立玄關 (+6分)</span>
      </label>
    </div>

    <!-- 第三行：分數極端值套用按鈕群 -->
    <div class="type-selector" style="margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e2e8f0; align-items: center;">
      <label>分數套用：</label>
      <div class="btn-group">
        <button type="button" class="type-btn" onclick="applyExtremePreset('max')" style="background: #f0fdf4; border-color: #86efac; color: #166534; font-weight: 600;">
          ★ 最高標分
        </button>
        <button type="button" class="type-btn" onclick="applyExtremePreset('min')" style="background: #fef2f2; border-color: #fecaca; color: #991b1b; font-weight: 600;">
          ▲ 最低標分
        </button>
        <button type="button" class="type-btn" onclick="resetToDefault()" style="background: #f1f5f9; border-color: #cbd5e1; color: #475569; font-weight: 600;">
          ↺ 恢復預設
        </button>
      </div>
    </div>

    <!-- 第四行：AI 數據匯入與狀態 JSON 匯出 -->
    <div class="type-selector" style="margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e2e8f0; display: flex; gap: 12px;">
      <button type="button" class="type-btn" onclick="importFromAI()" style="flex: 1; background: #eef2ff; border-color: #a5b4fc; color: #4338ca; font-weight: 700; padding: 10px 0; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span>⚡ 匯入 AI 檢核數據</span>
      </button>
      <button type="button" class="type-btn" onclick="exportCurrentJSON()" style="flex: 1; background: #f0fdf4; border-color: #86efac; color: #166534; font-weight: 700; padding: 10px 0; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span>💾 下載評估代碼 TXT</span>
      </button>
    </div>
  </header>

  <!-- 第三區塊：家配平面圖卡片 -->
  <div class="card" id="planCard" style="position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
      <h3 style="margin: 0; font-size: 1.1rem; color: #1e3a8a; font-weight: 700;">家配平面圖</h3>
      <!-- 圖片控制按鈕區（有圖片時顯示） -->
      <div id="planImgActions" style="display: none; gap: 8px; z-index: 10;">
        <button type="button" onclick="triggerReupload()" style="display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; font-size: 0.85rem; background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; border-radius: 6px; cursor: pointer; font-weight: 700;">
          🔄 更換圖片
        </button>
        <button type="button" onclick="removeFloorPlan()" style="display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; font-size: 0.85rem; background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 6px; cursor: pointer; font-weight: 700;">
          🗑️ 移除圖片
        </button>
      </div>
    </div>

    <div class="plan-wrapper" style="position: relative; min-height: 240px; display: flex; align-items: center; justify-content: center; border: 2px dashed #cbd5e1; border-radius: 8px; background: #f8fafc; overflow: hidden;">
      <!-- 實體檔案選擇器：直接放在卡片內部 -->
      <input type="file" id="iptFloorPlan" accept="image/*" onchange="onFloorPlanUpload(this)" style="display: none;">

      <!-- 原生 label 連動：點擊 100% 觸發檔案選擇，不依賴 JS 點擊監聽 -->
      <label for="iptFloorPlan" id="planPlaceholder" style="cursor: pointer; text-align: center; padding: 40px 20px; width: 100%; height: 100%; display: block;">
        <div style="font-size: 2.4rem; margin-bottom: 8px;">🖼️</div>
        <div style="font-weight: 700; color: #475569; font-size: 1rem;">點擊上傳家配平面圖</div>
        <div style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">支援 JPG、PNG 格式</div>
      </label>

      <!-- 上傳後的圖片顯示區 -->
      <img id="imgFloorPlan" src="" alt="家配圖" style="display: none; width: 100%; max-height: 520px; object-fit: contain; cursor: pointer;" onclick="triggerReupload()" title="點擊可更換圖片">
    </div>
  </div>

  <!-- 第四區塊：空間機能指標雷達圖 -->
  <div id="radarChartCard" class="space-card" style="padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; align-items: center;">
    <div style="width: 100%; font-weight: 700; color: var(--primary); font-size: 1.05rem; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
      空間機能指標雷達圖
    </div>
    <div style="position: relative; width: 100%; max-width: 440px; height: 300px;">
      <canvas id="radarChart"></canvas>
    </div>
  </div>

  <!-- 第五區塊：評分結果綜合結語 -->
  <div id="conclusionCard" class="space-card" style="padding: 16px; margin-bottom: 20px;">
    <div style="width: 100%; font-weight: 700; color: var(--primary); font-size: 1.05rem; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
      評估綜合結語
    </div>
    <textarea id="iptConclusion" placeholder="請輸入本案戶型規劃優缺點、動線採光及整體評語..." style="width: 100%; min-height: 80px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; line-height: 1.5; resize: vertical;"></textarea>
    <div id="dispConclusion" style="display: none; font-size: 0.95rem; line-height: 1.6; color: #334155; white-space: pre-wrap;"></div>
  </div>

  <!-- 第二頁起：各空間詳細檢核卡片 -->
  <div id="spacesContainer"></div>
</div>

<div class="sticky-footer">
  <div class="footer-inner">
    <div class="score-summary">
      <div class="score-item">
        <span class="label">低標分數加總</span>
        <span class="val" id="dispLowSum">0.0</span>
      </div>
      <div class="score-item">
        <span class="label">高標分數加總</span>
        <span class="val" id="dispHighSum">0.0</span>
      </div>
      <div class="score-item">
        <span class="label">實得分數加總</span>
        <span class="val" id="dispRaw">0.0</span>
      </div>
      <div class="score-item">
        <span class="label">轉換百分制分數</span>
        <div class="final-score-box">
          <span class="final-score" id="dispFinal">60.0</span>
          <span class="final-unit">分</span>
        </div>
      </div>
    </div>
    <button class="btn-action" onclick="exportReportPDF()">輸出評估結果 PDF</button>
  </div>
</div>

<!-- 自訂 AI 匯入彈出視窗 (Modal) -->
<div id="aiModal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
  <div style="background: white; border-radius: 12px; max-width: 600px; width: 100%; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="color: var(--primary); font-size: 1.15rem; font-weight: 700;">⚡ 貼上 AI 檢核數據代碼</h3>
      <button type="button" onclick="closeAiModal()" style="background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #64748b;">✕</button>
    </div>
    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 10px;">請將 AI 產出的評估代碼（可整段多行直接貼上）複製於下方：</p>
    <textarea id="iptAiJson" placeholder='貼上例如：{"projectName":"遠雄OO", ...}' style="width: 100%; height: 180px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: monospace; font-size: 0.85rem; resize: vertical; margin-bottom: 16px; outline: none;"></textarea>
    <div style="display: flex; justify-content: flex-end; gap: 10px;">
      <button type="button" onclick="closeAiModal()" style="padding: 8px 16px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; font-weight: 600; color: #475569;">取消</button>
      <button type="button" onclick="confirmImportFromAI()" style="padding: 8px 18px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">確認載入</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
